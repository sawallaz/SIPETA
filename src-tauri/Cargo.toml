[package]
name = "sipeta"
version = "1.0.0"
description = "SIPETA - Sistem Informasi Pelayanan Administrasi"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sipeta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.0.0", features = [] }
tauri-utils = { version = "=2.0.0" }
tauri-codegen = { version = "=2.0.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.0.0", features = ["tray-icon"] }
tauri-plugin-log = "=2.0.0"
tauri-utils = "=2.0.0"
tauri-runtime = "=2.0.0"
tauri-runtime-wry = "=2.0.0"
tauri-macros = "=2.0.0"
dirs = "5.0"
libc = "0.2"
